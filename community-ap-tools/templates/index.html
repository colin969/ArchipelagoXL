<html>
    <head>
        <link rel="stylesheet" href="/static/contrib/font-awesome/css/all.min.css">
        <link rel="stylesheet" href="/static/tabulator_site_dark.min.css">
        <script src="/static/review-utils.js"></script>
        <script src="/static/tabulator.min.js"></script>
        <style>

body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    color: white;
    background-color: rgb(25, 25, 25);
    font-family: Verdana, sans-serif;
}

#popup {
    color: white;
    background-color: rgb(25, 25, 25);
}

table, tr, td {
    border: 1px solid white;
    border-collapse: collapse;
}
table {
    margin-bottom: 1em;
    color: white;
}
td {
    padding: 2px;
}

.slot-status::before {
    font-weight: bold;
    content: "?";
}

.slot-status-green {
    background-color: green
}

.slot-status-yellow {
    background-color: yellow
}

.slot-status-red {
    background-color: red
}

.slot-status-Disconnected::before {
    color: red;
    content: "D";
}

.slot-status-Connected::before, .slot-status-Ready::before, .slot-status-Playing::before {
    color: yellow;
    content: "P";
}

.slot-status-GoalCompleted::before {
    color: green;
    content: "G";
}

.page-wrapper {
    padding: 1rem;
}

.button-row {
    flex-direction: row;
}

.button-row > *:not(:first-child) {
    margin-left: 0.5rem;
}

.review-table-wrapper {
    height: 70vh;
    margin-top: 1rem;
    margin-bottom: 1rem;
}

.error-box {
    background-color: #610505;
    padding: 0.5em;
    width: 100%;
}

.last-active-softbk {
    background-color: orange;
    color: black;
}

.last-active-hardbk {
    background-color: darkred;
}

.tabulator-footer {
    color: white !important;
}

.tabulator-menu {
    background: rgb(35,35,35) !important;
}

.tabulator-menu-item:hover {
    background: rgb(80, 80, 80) !important;
}
        </style>
    <script>
        window.lobby_root_url = "{{ lobby_root_url }}";
        window.lobby_room_id = "{{ lobby_room_id }}";
    </script>
    </head>
    <body id="main">

        <div class="page-wrapper">
            <h2>Helper Dashboard</h2>
            <div class="button-row">
                <a href="{{ lobby_root_url}}/room/{{lobby_room_id}}"><button>Ionium Lobby</button></a>
                <a href="/rooms"><button>Room Settings</button></a>
                <a href="/dashboard/{{ lobby_room_id }}/deathlinks"><button>Deathlink Settings</button></a>                <button onclick="genAllPasswords()">Generate Passwords</button>
                <button onclick="openAllChecksTable()">View All Checks</button>
                <button onclick="resetTable()">Reset Table</button>
            </div>

            <div class="review-table-wrapper">
                <div id="review-table"></div>
            </div>

            <script defer>
                createTrackerTable("#review-table");
            </script>

            <button onclick="refreshSlotsToPing()">Refresh Slots to Ping</button>
            <div id="unconnected-slots">
                Slots that have never sent a check:
                <ul>
                    Loading
                </ul>
            </div>

            <button onclick="refreshSphere1ToPing()">Refresh Slots to Ping</button>
            <div id="sphere1-incomplete-slots">
                Slots that haven't finished their Sphere 1 checks:
                <ul>
                    Loading
                </ul>
            </div>

            <ul>
                <li><span class="slot-status slot-status-green"></span> Slot is ok</li>
                <li><span class="slot-status slot-status-yellow"></span> Slot is BK'd since &gt; 30mn or connected without any check done</li>
                <li><span class="slot-status slot-status-red"></span> Slot is BK'd since &gt; 1h. Or disconnected, no checks.</li>
            </ul>
        </div>
    </body>

    <script>
        function copySlotHandles(button) {
            const li = button.parentElement;
            const spans = li.querySelectorAll('span[data-discord-id]');
            const mentions = Array.from(spans).map(s => '<@' + s.dataset.discordId + '>').join(' ');
            const message = mentions + " you are not connected chrisNya. If you need help please join the AP tech support. If you are connected in the meantime all good, you can ignore the ping chrisNya";
            navigator.clipboard.writeText(message);
        }

        function resetTable() {
            Object.keys(localStorage)
                .filter(key => key.startsWith('tabulator-'))
                .forEach(key => localStorage.removeItem(key));
            location.reload();
        }

        function openDeathBlock(slotId, slotName, slotGame, isBlocked) {
            const popup = getPopup();

            const confirmationText = document.createElement("div");
            const action = isBlocked ? "Allow Deaths from " : "Block Deaths from "
            confirmationText.innerText = action + slotName + " playing " + slotGame + ". Are you sure?";

            const buttonContainer = document.createElement("div");
            buttonContainer.className = "button-row";

            const yesButton = document.createElement("button")
            yesButton.innerText = "Yes"
            yesButton.addEventListener("click", async () => {
                const method = isBlocked ? 'DELETE' : 'POST';
                const response = await fetch(`/api/dashboard/${window.lobby_room_id}/bounce_exclusions/${slotId}/DeathLink`, { method });
                if (response.ok) {
                    forceReviewTableRefresh();
                    popup.remove();
                } else {
                    alert("Failed to toggle - " + response.statusText);
                    popup.remove();
                }
            })

            const noButton = document.createElement("button")
            noButton.innerText = "No"
            noButton.addEventListener("click", () => popup.remove())

            buttonContainer.appendChild(yesButton)
            buttonContainer.appendChild(noButton)

            popup.appendChild(confirmationText)
            popup.appendChild(buttonContainer)
        }

        function openFullFeed(slotId, slotName, slotGame, isFullFeed) {
            const popup = getPopup();

            const confirmationText = document.createElement("div");
            const action = isFullFeed ? "Stop full feed to " : "Allow full feed to "
            confirmationText.innerText = action + slotName + " playing " + slotGame + ". Are you sure?";

            const buttonContainer = document.createElement("div");
            buttonContainer.className = "button-row";

            const yesButton = document.createElement("button")
            yesButton.innerText = "Yes"
            yesButton.addEventListener("click", async () => {
                const method = isFullFeed ? 'DELETE' : 'POST';
                const response = await fetch(`/api/dashboard/${window.lobby_room_id}/full_feed/${slotId}`, { method });
                if (response.ok) {
                    forceReviewTableRefresh();
                    popup.remove();
                } else {
                    alert("Failed to toggle - " + response.statusText);
                    popup.remove();
                }
            })

            const noButton = document.createElement("button")
            noButton.innerText = "No"
            noButton.addEventListener("click", () => popup.remove())

            buttonContainer.appendChild(yesButton)
            buttonContainer.appendChild(noButton)

            popup.appendChild(confirmationText)
            popup.appendChild(buttonContainer)
        }

        function openRelease(slotName, slotGame) {
            const popup = getPopup();

            const confirmationText = document.createElement("div")
            confirmationText.innerText = "You're about to goal the slot " + slotName + " playing " + slotGame + ". Please type the slot name in the following field to confirm."

            const confirmationForm = document.createElement("form")
            confirmationForm.action = "javascript:void(0);"
            const confirmationInput = document.createElement("input")
            confirmationInput.type = "text"

            const confirmationButton = document.createElement("button")
            confirmationButton.innerText = "Release"

            confirmationForm.appendChild(confirmationInput)
            confirmationForm.appendChild(confirmationButton)

            confirmationForm.addEventListener("submit", () => {
                if (confirmationInput.value != slotName) {
                    alert("Wrong slot name");
                    return
                }

                // TODO: Test this with a space in slot name
                actionUrl = `/api/dashboard/${window.lobby_room_id}/release/${encodeURIComponent(slotName)}`;
                fetch(actionUrl)
                .then(() => {
                    alert("Release action submitted to queue")
                })
                .catch(err => {
                    alert(`Failed to complete release action: ${err}`);
                });
            })

            popup.appendChild(confirmationText);
            popup.appendChild(confirmationForm);
            confirmationInput.focus();
        }

        function openAction(action, slotName, slotGame, ty) {
            const popup = getPopup();

            const hintText = document.createElement("div")
            hintText.innerText = "You're about to " + action + " a(n) " + ty + " for the slot " + slotName + " playing " + slotGame

            const hintForm = document.createElement("form")
            hintForm.action = "javascript:void(0);"
            const hintInput = document.createElement("input")
            hintInput.type = "text"
            hintInput.name = "hint"
            hintInput.setAttribute("autocomplete", "off")
            hintInput.setAttribute("list", "hint-datalist")

            const hintButton = document.createElement("button")
            hintButton.innerText = action + " " + ty
            const hintList = document.createElement("datalist")
            hintList.id = "hint-datalist"

            const url = new URL(`/api/dashboard/${window.lobby_room_id}/names/${ty}/${encodeURIComponent(slotGame)}`, document.location);
            fetch(url)
                .then((response) => {
                    return response.json()
                })
                .then((names) => {
                    for (const name of names) {
                        const option = document.createElement("option")
                        option.value = name
                        hintList.appendChild(option)
                    }
                })

            hintForm.appendChild(hintInput)
            hintForm.appendChild(hintList)
            hintForm.appendChild(hintButton)

            hintForm.addEventListener("submit", () => {
                actionUrl = `/api/dashboard/${window.lobby_room_id}/${action}/${ty}/${encodeURIComponent(slotName)}/${encodeURIComponent(hintInput.value)}`
                fetch(actionUrl)
                .then(() => {
                    alert("Action submitted to queue")
                })
                .catch(err => {
                    alert(`Failed to complete action: ${err}`);
                });
            })
            popup.appendChild(hintText)
            popup.appendChild(hintForm)
            hintInput.focus()
        }

        function openPasswordPopup(yamlId, slotName, currentPassword) {
            const popup = getPopup();

            const title = document.createElement("div")
            title.innerText = "Password for slot: " + slotName
            title.style.marginBottom = "10px"

            const passwordDisplay = document.createElement("div")
            passwordDisplay.style.marginBottom = "15px"
            passwordDisplay.style.padding = "10px"
            passwordDisplay.style.border = "1px solid white"

            if (currentPassword) {
                passwordDisplay.innerText = "Current password: " + currentPassword;
                passwordDisplay.style.cursor = "pointer"
                passwordDisplay.addEventListener("click", () => {
                    navigator.clipboard.writeText(currentPassword);
                });
            } else {
                passwordDisplay.innerText = "No password set"
            }

            const generateButton = document.createElement("button")
            generateButton.innerText = "Generate New Password"
            generateButton.style.marginRight = "10px"
            generateButton.addEventListener("click", () => {
                const newPassword = generatePassword()
                setPassword(yamlId, newPassword)
            })

            const removeButton = document.createElement("button")
            removeButton.innerText = "Remove Password"
            removeButton.addEventListener("click", () => {
                setPassword(yamlId, null)
            })

            popup.appendChild(title)
            popup.appendChild(passwordDisplay)
            popup.appendChild(generateButton)
            popup.appendChild(removeButton)
        }

        function genAllPasswords() {
            const popup = getPopup()

            const title = document.createElement("div")
            title.innerText = "Generate passwords for all slots that don't have one?"
            title.style.marginBottom = "10px"

            const buttonRow = document.createElement("div")
            buttonRow.style.display = "flex"
            buttonRow.style.gap = "0.5rem"

            const confirmButton = document.createElement("button")
            confirmButton.innerText = "Generate"
            confirmButton.addEventListener("click", () => {
                popup.close()
                const url = new URL(`/api/dashboard/${window.lobby_room_id}/gen_all_passwords`, document.location)
                fetch(url, { method: "POST" })
                    .then((response) => {
                        if (response.ok) {
                            alert("Genned passwords");
                        } else {
                            alert("Failed to generate passwords")
                        }
                    })
                    .catch((error) => {
                        alert("Error: " + error)
                    })
            })

            const cancelButton = document.createElement("button")
            cancelButton.innerText = "Cancel"
            cancelButton.addEventListener("click", () => popup.close())

            buttonRow.appendChild(confirmButton)
            buttonRow.appendChild(cancelButton)
            popup.appendChild(title)
            popup.appendChild(buttonRow)
        }


        function generatePassword() {
            const length = 6
            const charset = "ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789"
            let password = ""
            for (let i = 0; i < length; i++) {
                password += charset.charAt(Math.floor(Math.random() * charset.length))
            }
            return password
        }

        function setPassword(yamlId, password) {
            const url = new URL(`/api/dashboard/${window.lobby_room_id}/set_password/${yamlId}`, document.location)
            fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({ password: password })
            })
            .then((response) => {
                if (response.ok) {
                    alert("Password changed");
                    popup && popup.close();
                } else {
                    alert("Failed to update password")
                }
            })
            .catch((error) => {
                alert("Error: " + error)
            })
        }

        function openChangeOwnerPopup(yamlId, slotName, currentPassword) {
            const popup = getPopup();

            const title = document.createElement("div")
            title.innerText = "Change owner for slot: " + slotName
            title.style.marginBottom = "10px"

            const form = document.createElement("form")
            form.action = "javascript:void(0);"

            const discordIdLabel = document.createElement("div")
            discordIdLabel.innerText = "New owner Discord ID:"
            const discordIdInput = document.createElement("input")
            discordIdInput.type = "text"
            discordIdInput.required = true
            discordIdInput.style.display = "block"
            discordIdInput.style.marginBottom = "10px"

            const confirmLabel = document.createElement("div")
            confirmLabel.innerText = "Type the slot name to confirm:"
            confirmLabel.style.marginTop = "10px"
            const confirmInput = document.createElement("input")
            confirmInput.type = "text"
            confirmInput.required = true
            confirmInput.style.display = "block"
            confirmInput.style.marginBottom = "10px"

            const submitButton = document.createElement("button")
            submitButton.innerText = "Change Owner"
            submitButton.style.display = "block"
            submitButton.style.marginTop = "10px"

            form.appendChild(discordIdLabel)
            form.appendChild(discordIdInput)
            form.appendChild(confirmLabel)
            form.appendChild(confirmInput)
            form.appendChild(submitButton)

            form.addEventListener("submit", () => {
                if (confirmInput.value !== slotName) {
                    alert("Slot name doesn't match")
                    return
                }

                const newOwnerId = discordIdInput.value.trim()
                if (!newOwnerId || !/^\d+$/.test(newOwnerId)) {
                    alert("Please enter a valid Discord ID (numeric)")
                    return
                }

                const body = { new_owner_id: newOwnerId }
                if (currentPassword) {
                    body.new_password = generatePassword()
                }

                const url = new URL(`/api/dashboard/${window.lobby_room_id}/change_owner/${yamlId}`, document.location)
                fetch(url, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body)
                })
                .then((response) => {
                    if (response.ok) {
                        alert("Owner changed")
                        popup && popup.close();
                        forceReviewTableRefresh();
                    } else {
                        alert("Failed to change owner")
                    }
                })
                .catch((error) => {
                    alert("Error: " + error)
                })
            })

            popup.appendChild(title)
            popup.appendChild(form)
            discordIdInput.focus()
        }

        function openChecksTable(slotId, slotName) {
            const popup = getPopup();
            popup.style.width = "80vw";
            popup.style.height = "80vh";
            popup.style.display = "flex";
            popup.style.flexDirection = "column";

            const title = h("div", { className: "popup-title" }, `Checks for ${slotName}`);

            // Table on left, stats on right
            const contentRow = document.createElement("div");
            contentRow.style.display = "flex";
            contentRow.style.flex = "1";
            contentRow.style.minHeight = "0";
            contentRow.style.marginTop = "0.5rem";
            contentRow.style.gap = "0.5rem";

            const tableContainer = document.createElement("div");
            tableContainer.style.flex = "1";
            tableContainer.style.minHeight = "0";
            tableContainer.id = `checks-table-${slotId}`;

            const sphereSidebar = document.createElement("div");
            sphereSidebar.id = `sphere-sidebar-${slotId}`;
            sphereSidebar.style.width = "200px";
            sphereSidebar.style.overflowY = "auto";
            sphereSidebar.style.border = "1px solid white";
            sphereSidebar.style.padding = "0.5rem";
            sphereSidebar.style.fontSize = "0.85em";

            const sidebarTitle = document.createElement("div");
            sidebarTitle.innerText = "Spheres";
            sidebarTitle.style.fontWeight = "bold";
            sidebarTitle.style.marginBottom = "0.5rem";
            sphereSidebar.appendChild(sidebarTitle);

            contentRow.appendChild(tableContainer);
            contentRow.appendChild(sphereSidebar);

            popup.appendChild(title);
            popup.appendChild(contentRow);

            // Give it a frame for dom to update
            requestAnimationFrame(() => {
                createChecksTable(`#checks-table-${slotId}`, slotId, sphereSidebar);
            });
        }

        function openAllChecksTable() {
            const popup = getPopup();
            popup.style.width = "90vw";
            popup.style.height = "90vh";
            popup.style.display = "flex";
            popup.style.flexDirection = "column";

            const title = h("div", { className: "popup-title" }, "All Checks");

            const contentRow = document.createElement("div");
            contentRow.style.display = "flex";
            contentRow.style.flex = "1";
            contentRow.style.minHeight = "0";
            contentRow.style.marginTop = "0.5rem";
            contentRow.style.gap = "0.5rem";

            const tableContainer = document.createElement("div");
            tableContainer.style.flex = "1";
            tableContainer.style.minHeight = "0";
            tableContainer.id = "all-checks-table";

            const sphereSidebar = document.createElement("div");
            sphereSidebar.id = `sphere-sidebar`;
            sphereSidebar.style.width = "200px";
            sphereSidebar.style.minHeight = "0";
            sphereSidebar.style.overflowY = "auto";
            sphereSidebar.style.border = "1px solid white";
            sphereSidebar.style.padding = "0.5rem";
            sphereSidebar.style.fontSize = "0.85em";

            const sidebarTitle = document.createElement("div");
            sidebarTitle.innerText = "Spheres";
            sidebarTitle.style.fontWeight = "bold";
            sidebarTitle.style.marginBottom = "0.5rem";
            sphereSidebar.appendChild(sidebarTitle);

            contentRow.appendChild(tableContainer);
            contentRow.appendChild(sphereSidebar);
            popup.appendChild(title);
            popup.appendChild(contentRow);

            requestAnimationFrame(() => {
                createAllChecksTable("#all-checks-table", sphereSidebar);
            });
        }

        function getPopup() {
            const popup = document.createElement("dialog");
            popup.id = "popup"
            popup.onclick = (event) => { event.target == popup && popup.close(); return true; }


            const body = document.getElementById("main");
            body.append(popup);
            popup.onclose = () => body.removeChild(popup);

            popup.showModal()

            return popup
        }
    </script>
</html>
